[project]
name = "poc09-model-router-runtime-sample"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["azurefunctions-agents-runtime"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.uv.sources]
azurefunctions-agents-runtime = { path = "../../azure-functions-agents-runtime", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
